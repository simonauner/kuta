services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: kuta
      POSTGRES_PASSWORD: kuta
      POSTGRES_DB: kuta
    ports:
      - "5432:5432"
    volumes:
      - kuta-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuta -d kuta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kuta-db:
