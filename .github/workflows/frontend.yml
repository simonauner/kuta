name: Frontend

on:
  pull_request:
    paths:
      - 'web/**'
      - '.nvmrc'
      - '.github/workflows/frontend.yml'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.nvmrc'
      - '.github/workflows/frontend.yml'
      - 'Dockerfile'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
