name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml

  api:
    uses: ./.github/workflows/api.yml

  deploy:
    needs: [frontend, api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://kutaapp.com
    # Never interrupt a running deploy or run two migrations/deploys at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Checks can finish out of order; an older commit must not replace a newer one.
      - name: Check that the commit is still the tip of main
        id: latest
        shell: bash
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $GITHUB_SHA because main is at $head."
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.latest.outputs.deploy == 'true'
      - name: Deploy to Fly.io
        if: steps.latest.outputs.deploy == 'true'
        run: |
          test -n "$FLY_API_TOKEN" || { echo '::error::The Fly deploy token is missing.'; exit 1; }
          flyctl deploy --config fly.toml --app kuta --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # When flyctl replaces a machine instead of updating it, it can leave the old one behind,
      # and the proxy starts it again with the previous release.
      - name: Remove machines left on older releases
        if: steps.latest.outputs.deploy == 'true'
        run: |
          stale=$(flyctl machines list --app kuta --json | jq -r '
            [.[] | select(.config.metadata.fly_process_group == "app")]
            | (map(.config.metadata.fly_release_version | tonumber) | max) as $latest
            | .[] | select((.config.metadata.fly_release_version | tonumber) < $latest) | .id')
          for id in $stale; do
            echo "Destroying machine $id from an older release."
            flyctl machine destroy "$id" --app kuta --force
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
