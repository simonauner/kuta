# Fly.io-appen för Kuta. Hemligheterna sätts med `fly secrets set` (se README, Driftsättning).
app = 'kuta'
primary_region = 'arn'
# Utan swap dödar kärnan processen när den passerar maskinens minne.
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  # Klientens IP från Flys proxy för rate limiten, och https från X-Forwarded-Proto.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'
  ForwardedHeaders__ForwardedForHeaderName = 'Fly-Client-IP'
  # kuta.fly.dev och www skickas vidare hit (Program.cs). Deploya inte detta förrän kutaapp.com har DNS och certifikat.
  CanonicalHost = 'kutaapp.com'
  Supabase__Url = 'https://hrkqzqfyisvdyzfxzokf.supabase.co'
  # Publik nyckel, inte hemlig.
  Supabase__PublishableKey = 'sb_publishable_Df2B4jm1aXH1_uOy52EsXg_BmM8THXV'

[http_service]
  internal_port = 8080
  force_https = true
  # Stannar när ingen använder appen (billigast före lansering); första anropet väcker den.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
