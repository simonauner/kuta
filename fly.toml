# The Fly.io app for Kuta. The secrets are imported via `scripts/fly-secrets.sh` (see README, Driftsättning).
app = 'kuta'
primary_region = 'arn'
# Without swap the kernel kills the process when it exceeds the machine's memory.
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  # The client IP from Fly's proxy for the rate limit, and https from X-Forwarded-Proto.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'
  ForwardedHeaders__ForwardedForHeaderName = 'Fly-Client-IP'
  # kuta.fly.dev and www.kutaapp.com are redirected here (Program.cs). DNS at Cloudflare, domain at Hostup, certificate at Fly.
  CanonicalHost = 'kutaapp.com'
  Supabase__Url = 'https://umjqrlkeuppyhxnlyuid.supabase.co'
  # Public key, not secret.
  Supabase__PublishableKey = 'sb_publishable_mBsMPoNqEW4GAZ1HQ5FbKQ_R1VkmE8_'
  # Raw FIT files in Supabase Storage via S3 (private bucket); the key is in 1Password (fly.secrets.tpl).
  Storage__ServiceUrl = 'https://umjqrlkeuppyhxnlyuid.storage.supabase.co/storage/v1/s3'
  Storage__Region = 'eu-north-1'
  Storage__Bucket = 'fit-files'
  # Public Turnstile site key for the sign-up and password forms; the secret key is in 1Password (fly.secrets.tpl).
  Turnstile__SiteKey = '0x4AAAAAAFu-t_u8OWeN7XBa'

[http_service]
  internal_port = 8080
  force_https = true
  # Stops when nobody uses the app (cheapest before launch); the first request wakes it.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
